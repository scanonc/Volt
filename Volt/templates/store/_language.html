{% load i18n %}
{% get_current_language as language %}
{% get_available_languages as languages %}
<form action="{% url 'set_language' %}" method="post" class="language-picker">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="volt-language">{% translate "Idioma" %}</label>
  <select name="language" id="volt-language">
    {% for code, name in languages %}
      <option value="{{ code }}"{% if code == language %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit" aria-label="{% translate 'Cambiar idioma' %}">↵</button>
</form>
