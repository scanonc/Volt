events {}

http {
    include /etc/nginx/mime.types;

    upstream django_backend {
        server django:8000;
    }

    upstream chatbot_backend {
        server chatbot:5001;
    }

    upstream notifications_backend {
        server notifications:5000;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bloquear acceso externo a los endpoints internos de sincronización
        location ^~ /internal/ {
            return 403;
        }

        location = /api/chatbot {
            return 308 /api/chatbot/;
        }

        location /api/chatbot/ {
            proxy_pass http://chatbot_backend;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /api/v2/notifications {
            return 308 /api/v2/notifications/;
        }

        location /api/v2/notifications/ {
            proxy_pass http://notifications_backend;
        }

        location /api/v1/ {
            proxy_pass http://django_backend;
        }

        location /static/ {
            alias /static/;
        }

        location / {
            proxy_pass http://django_backend;
        }
    }
}
